<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-LAB</title>
<meta name="theme-color" content="#0f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="favicon.png">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="E-LAB">
<style>
  body { margin: 0; min-height: 100vh; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 16px;
         background: radial-gradient(circle at 50% 35%, #173e63, #0f2a44 70%); color: #e8f1f8; font-family: system-ui, sans-serif; text-align: center; }
  img { width: 112px; height: 112px; border-radius: 50%; background: #fff; }
  h1 { margin: 0; letter-spacing: .06em; }
  p { margin: 0; color: #9db3c6; font-size: 14px; padding: 0 20px; }
  .btn { display: inline-block; border: 0; border-radius: 10px; padding: 12px 22px; font-weight: 700; font-size: 15px; cursor: pointer;
         background: #1aa39d; color: #fff; text-decoration: none; margin: 4px; }
  .ghost { background: transparent; border: 1px solid rgba(255,255,255,.35); }
  .hidden { display: none; }
</style>
</head>
<body>
  <img src="icon-192.png" alt="">
  <h1>E-LAB</h1>
  <p id="msg">Membuka aplikasi…</p>
  <div id="btns" class="hidden">
    <a class="btn" id="open">Buka E-LAB</a>
    <button class="btn ghost hidden" id="install">Pasang aplikasi</button>
  </div>
  <p id="ios" class="hidden">iPhone: ketuk <b>Bagikan ⬆︎</b> di Safari, lalu <b>Tambahkan ke Layar Utama</b>.</p>
<script>
  // URL "Aplikasi web" proyek Lab Reminder App (berakhiran /exec)
  var APP_URL = 'https://script.google.com/macros/s/AKfycbxqhvI8ZK9bY_bj7Dz0R9ECP6pIx7dChpZbTykdZCshp43niuy_TXdm0Xd87E6RPEa6/exec';

  if (/TEMPEL_URL/.test(APP_URL)) { document.getElementById('msg').textContent = 'APP_URL belum diisi di index.html.'; throw 0; }
  var standalone = matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  document.getElementById('open').href = APP_URL;
  if (standalone) {
    // Dibuka dari aplikasi terpasang → langsung ke E-LAB
    location.replace(APP_URL);
  } else {
    // Dibuka dari browser → tampilkan tombol Buka & Pasang
    document.getElementById('msg').textContent = 'Pengingat jadwal sampling, DO & laporan lab';
    document.getElementById('btns').classList.remove('hidden');
    if (/iphone|ipad|ipod/i.test(navigator.userAgent)) document.getElementById('ios').classList.remove('hidden');
    var deferred = null, ib = document.getElementById('install');
    addEventListener('beforeinstallprompt', function(e) { e.preventDefault(); deferred = e; ib.classList.remove('hidden'); });
    ib.onclick = function() { if (deferred) { deferred.prompt(); deferred.userChoice.then(function() { ib.classList.add('hidden'); }); } };
  }
  if ('serviceWorker' in navigator) navigator.serviceWorker.register('sw.js').catch(function() {});
</script>
</body>
</html>
