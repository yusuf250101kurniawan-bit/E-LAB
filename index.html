<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>E-LAB</title>
<meta name="description" content="E-LAB — pengingat jadwal sampling, DO & laporan lab.">
<meta name="theme-color" content="#0f2a44">
<link rel="manifest" href="manifest.webmanifest">
<link rel="icon" type="image/png" href="icons/favicon.png">
<link rel="apple-touch-icon" href="icons/apple-touch-icon.png">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="E-LAB">
<script>
  // ════════════════════════════════════════════════════════════════════
  //  ALAMAT APLIKASI — URL "Aplikasi web" proyek Lab Reminder App (berakhiran /exec)
  //  Ganti di sini bila URL deployment berubah.
  // ════════════════════════════════════════════════════════════════════
  var APP_URL = 'https://script.google.com/macros/s/TEMPEL_ID_DEPLOYMENT_DI_SINI/exec';
</script>
<style>
  :root { --navy: #0f2a44; --teal: #1aa39d; --text: #e8f1f8; --muted: #9db3c6; }
  * { box-sizing: border-box; }
  html, body { margin: 0; height: 100%; background: var(--navy); color: var(--text);
               font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif; overflow: hidden; }
  #app { position: fixed; inset: 0; width: 100%; height: 100%; border: 0; background: #fff;
         padding-top: env(safe-area-inset-top); opacity: 0; transition: opacity .35s; }
  #app.ready { opacity: 1; }
  .splash { position: fixed; inset: 0; display: flex; flex-direction: column; align-items: center; justify-content: center; gap: 18px;
            background: radial-gradient(circle at 50% 35%, #173e63, var(--navy) 70%); transition: opacity .4s; z-index: 2; }
  .splash.gone { opacity: 0; pointer-events: none; }
  .ring { position: relative; width: 132px; height: 132px; }
  .ring img { position: absolute; inset: 14px; width: 104px; height: 104px; border-radius: 50%; background: #fff; }
  .ring::before { content: ''; position: absolute; inset: 0; border-radius: 50%; border: 3px solid rgba(255,255,255,.12);
                  border-top-color: var(--teal); animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .brand { font-weight: 800; letter-spacing: .06em; font-size: 22px; }
  .sub { color: var(--muted); font-size: 13px; text-align: center; padding: 0 24px; min-height: 18px; }
  .btn { border: 0; border-radius: 10px; padding: 11px 18px; font-weight: 700; font-size: 14px; cursor: pointer;
         background: var(--teal); color: #fff; }
  .btn.ghost { background: transparent; border: 1px solid rgba(255,255,255,.3); }
  .hidden { display: none !important; }
  .credit { position: absolute; bottom: calc(18px + env(safe-area-inset-bottom)); color: var(--muted); font-size: 12px; }
  /* tawaran pasang aplikasi */
  .install { position: fixed; left: 12px; right: 12px; bottom: calc(12px + env(safe-area-inset-bottom)); z-index: 5;
             background: #fff; color: #1b2733; border-radius: 14px; padding: 12px 14px; display: flex; align-items: center; gap: 12px;
             box-shadow: 0 10px 30px rgba(0,0,0,.3); max-width: 520px; margin: 0 auto; }
  .install img { width: 44px; height: 44px; border-radius: 10px; }
  .install .t { flex: 1; font-size: 13px; line-height: 1.35; }
  .install b { display: block; font-size: 14px; }
  .install .x { background: none; border: 0; font-size: 20px; color: #7a8796; cursor: pointer; padding: 4px 6px; }
</style>
</head>
<body>
<div class="splash" id="splash">
  <div class="ring"><img src="icons/icon-192.png" alt=""></div>
  <div class="brand">E-LAB</div>
  <div class="sub" id="msg">Memuat aplikasi…</div>
  <div class="hidden" id="retry" style="display:flex;gap:10px">
    <button class="btn" onclick="loadApp()">Coba lagi</button>
    <button class="btn ghost" onclick="window.open(APP_URL, '_blank')">Buka di browser</button>
  </div>
</div>

<iframe id="app" title="E-LAB" allow="camera; microphone; clipboard-read; clipboard-write; fullscreen; geolocation"></iframe>

<div class="install hidden" id="install">
  <img src="icons/icon-192.png" alt="">
  <div class="t" id="installText"><b>Pasang E-LAB</b>Buka seperti aplikasi, langsung dari layar utama.</div>
  <button class="btn" id="installBtn">Pasang</button>
  <button class="x" aria-label="Tutup" onclick="hideInstall(true)">×</button>
</div>

<script>
  var frame = document.getElementById('app'), splash = document.getElementById('splash');
  var msg = document.getElementById('msg'), retry = document.getElementById('retry');
  var TOKEN_KEY = 'lr_shell_token_v1', slowTimer = null;

  function loadApp() {
    retry.classList.add('hidden');
    if (!navigator.onLine) { msg.textContent = 'Tidak ada koneksi internet. Sambungkan internet lalu coba lagi.'; retry.classList.remove('hidden'); return; }
    if (/TEMPEL_ID/.test(APP_URL)) { msg.textContent = 'Alamat aplikasi belum diisi (APP_URL di index.html).'; return; }
    msg.textContent = 'Memuat aplikasi…';
    clearTimeout(slowTimer);
    slowTimer = setTimeout(function() { msg.textContent = 'Masih memuat… koneksi agak lambat.'; retry.classList.remove('hidden'); }, 20000);
    frame.src = APP_URL + (APP_URL.indexOf('?') === -1 ? '?' : '&') + 'app=1';
  }
  frame.addEventListener('load', function() {
    if (!frame.src) return;
    clearTimeout(slowTimer);
    frame.classList.add('ready');
    splash.classList.add('gone');
  });
  window.addEventListener('online', function() { if (!frame.classList.contains('ready')) loadApp(); });
  window.addEventListener('offline', function() {
    if (frame.classList.contains('ready')) return;
    msg.textContent = 'Tidak ada koneksi internet.'; retry.classList.remove('hidden');
  });

  // ── Menitipkan login dari aplikasi di dalam bingkai (Google Apps Script) ──
  // Hanya menerima pesan dari server Google Apps Script.
  window.addEventListener('message', function(e) {
    if (!/^https:\/\/[a-z0-9-]+\.googleusercontent\.com$/.test(e.origin) || !e.data || typeof e.data !== 'object') return;
    if (typeof e.data.lrToken === 'string') {
      try { e.data.lrToken ? localStorage.setItem(TOKEN_KEY, e.data.lrToken) : localStorage.removeItem(TOKEN_KEY); } catch (x) {}
    } else if (e.data.lrGet) {
      var t = ''; try { t = localStorage.getItem(TOKEN_KEY) || ''; } catch (x) {}
      try { e.source.postMessage({ lrToken: t }, e.origin); } catch (x) {}
    }
  });

  // ── Tawaran "Pasang aplikasi" ──
  var deferred = null, standalone = window.matchMedia('(display-mode: standalone)').matches || navigator.standalone === true;
  function hideInstall(forever) {
    document.getElementById('install').classList.add('hidden');
    if (forever) { try { localStorage.setItem('lr_install_hide', String(Date.now())); } catch (x) {} }
  }
  function maybeShowInstall() {
    if (standalone) return;
    try { var h = +localStorage.getItem('lr_install_hide') || 0; if (Date.now() - h < 7 * 864e5) return; } catch (x) {}
    document.getElementById('install').classList.remove('hidden');
  }
  window.addEventListener('beforeinstallprompt', function(e) {
    e.preventDefault(); deferred = e;
    document.getElementById('installBtn').onclick = function() {
      deferred.prompt();
      deferred.userChoice.then(function() { deferred = null; hideInstall(true); });
    };
    setTimeout(maybeShowInstall, 2500);
  });
  window.addEventListener('appinstalled', function() { hideInstall(true); });
  // iPhone / iPad (Safari): tidak ada tombol pasang otomatis → tampilkan petunjuk
  if (/iphone|ipad|ipod/i.test(navigator.userAgent) && !standalone) {
    document.getElementById('installText').innerHTML = '<b>Pasang di iPhone</b>Ketuk tombol <b style="display:inline">Bagikan ⬆︎</b> di Safari, lalu pilih <b style="display:inline">“Tambahkan ke Layar Utama”</b>.';
    document.getElementById('installBtn').classList.add('hidden');
    setTimeout(maybeShowInstall, 2500);
  }

  if ('serviceWorker' in navigator) {
    window.addEventListener('load', function() { navigator.serviceWorker.register('sw.js').catch(function() {}); });
  }
  loadApp();
</script>
</body>
</html>
